<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#ccd0ce"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs><rect x="0" y="0" width="1600" height="1040" rx="8" fill="#faf7ef" stroke="none" /><rect x="0" y="125" width="1600" height="865" rx="8" fill="url(#grid)" stroke="none" /><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#20232a">04 / UNO DISPLAY STATION</text><text x="52" y="98" font-family="Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#677078">LCD and seven-segment share one Uno, with separate responsibilities.</text><path d="M52 118L1548 118" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><rect x="65" y="165" width="370" height="195" rx="8" fill="white" stroke="#c5c9c5" /><rect x="65" y="165" width="370" height="11" rx="0" fill="#447aa3" stroke="none" /><text x="85" y="213" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">ARDUINO UNO</text><text x="85" y="253" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">USB from Pi</text><text x="85" y="288" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">LCD: 5V / GND / A4 / A5</text><text x="85" y="323" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Segments: digital 2 through 8</text><rect x="65" y="420" width="490" height="195" rx="8" fill="white" stroke="#c5c9c5" /><rect x="65" y="420" width="490" height="11" rx="0" fill="#467758" stroke="none" /><text x="85" y="468" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#467758">16x2 I2C LCD @ 0x27</text><text x="85" y="508" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GND -&gt; Uno GND</text><text x="85" y="543" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">VCC -&gt; Uno 5V</text><text x="85" y="578" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">SDA -&gt; A4 | SCL -&gt; A5</text><text x="685" y="185" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b65f32">ONE 330-OHM RESISTOR PER SEGMENT</text><text x="690" y="248" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 2</text><path d="M820 240L848 240" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="226" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="247" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 240L988 240" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 240L1050 240" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="248" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 7 / a</text><text x="690" y="317" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 3</text><path d="M820 309L848 309" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="295" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="316" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 309L988 309" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 309L1050 309" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="317" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 6 / b</text><text x="690" y="386" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 4</text><path d="M820 378L848 378" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="364" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="385" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 378L988 378" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 378L1050 378" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="386" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 4 / c</text><text x="690" y="455" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 5</text><path d="M820 447L848 447" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="433" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 447L988 447" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 447L1050 447" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="455" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 2 / d</text><text x="690" y="524" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 6</text><path d="M820 516L848 516" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="502" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="523" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 516L988 516" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 516L1050 516" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="524" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 1 / e</text><text x="690" y="593" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 7</text><path d="M820 585L848 585" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="571" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="592" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 585L988 585" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 585L1050 585" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="593" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 9 / f</text><text x="690" y="662" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno 8</text><path d="M820 654L848 654" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><rect x="848" y="640" width="110" height="28" rx="5" fill="#e5c895" stroke="#b39968" /><text x="903" y="661" font-family="Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#20232a">330 ohm</text><path d="M958 654L988 654" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><path d="M988 654L1050 654" fill="none" stroke="#b65f32" stroke-width="3" stroke-linecap="round" /><text x="1070" y="662" font-family="Arial,sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#20232a">5161AS pin 10 / g</text><rect x="660" y="755" width="870" height="170" rx="8" fill="white" stroke="#c6ccc6" /><text x="687" y="792" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#467758">COMMON CATHODE / FRONT VIEW</text><text x="687" y="830" font-family="Arial,sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#20232a">Pins 3 and 8 -&gt; Uno GND. Pin 5 (decimal) unused.</text><text x="687" y="869" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">Top, left to right: 10  9  8  7  6</text><text x="687" y="905" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Bottom, left to right: 1  2  3  4  5  | dot at bottom right</text><rect x="65" y="720" width="490" height="199" rx="8" fill="#ebe5d6" stroke="none" /><text x="88" y="756" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b65f32">NOT THE NANO</text><text x="88" y="796" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">The display driver runs on the Uno.</text><text x="88" y="836" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Nano D2-D9 belong to the keypad.</text><text x="88" y="876" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#20232a">The photographed build exposed this</text><text x="88" y="903" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#20232a">easy-to-make board-name mistake.</text><path d="M52 971L1548 971" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><text x="52" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#677078">Each segment needs its own resistor. Do not replace all seven resistors with one common-ground resistor.</text></svg>