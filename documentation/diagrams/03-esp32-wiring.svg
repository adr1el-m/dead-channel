<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#ccd0ce"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs><rect x="0" y="0" width="1600" height="1040" rx="8" fill="#faf7ef" stroke="none" /><rect x="0" y="125" width="1600" height="865" rx="8" fill="url(#grid)" stroke="none" /><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#20232a">03 / ESP32 CONTROL STATION</text><text x="52" y="98" font-family="Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#677078">3.3 V signals. GPIO numbers are board labels, not physical header positions.</text><path d="M52 118L1548 118" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><rect x="70" y="178" width="385" height="300" rx="8" fill="white" stroke="#c5c9c5" /><rect x="70" y="178" width="385" height="11" rx="0" fill="#276f6e" stroke="none" /><text x="90" y="226" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#276f6e">ESP32 DEV BOARD</text><text x="90" y="266" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">3V3 / GND</text><text x="90" y="301" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GPIO32 / GPIO33</text><text x="90" y="336" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GPIO27 / GPIO25</text><text x="90" y="371" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GPIO34</text><text x="90" y="406" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GPIO18 / 19 / 23</text><text x="90" y="441" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">GPIO26</text><rect x="665" y="164" width="865" height="120" rx="8" fill="white" stroke="#c4c9c3" /><text x="690" y="197" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#276f6e">JOYSTICK</text><text x="690" y="231" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">VCC -&gt; 3V3 | GND -&gt; GND</text><text x="690" y="264" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#677078">VRx -&gt; 32 | VRy -&gt; 33 | SW -&gt; 27</text><path d="M455 220H500V222H665" fill="none" stroke="#276f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="665" y="308" width="865" height="120" rx="8" fill="white" stroke="#c4c9c3" /><text x="690" y="341" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#276f6e">CONNECT BUTTON</text><text x="690" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">GPIO25 -&gt; switch -&gt; GND</text><text x="690" y="408" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#677078">Internal pull-up; pressed = LOW</text><path d="M455 276H525V366H665" fill="none" stroke="#276f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="665" y="452" width="865" height="120" rx="8" fill="white" stroke="#c4c9c3" /><text x="690" y="485" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#276f6e">TUNING POTENTIOMETER</text><text x="690" y="519" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">Outer legs -&gt; 3V3 and GND</text><text x="690" y="552" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#677078">Wiper / middle -&gt; GPIO34</text><path d="M455 332H550V510H665" fill="none" stroke="#276f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="665" y="596" width="865" height="120" rx="8" fill="white" stroke="#c4c9c3" /><text x="690" y="629" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#276f6e">THREE INDICATOR LEDs</text><text x="690" y="663" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">18 green / 19 yellow / 23 red</text><text x="690" y="696" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#677078">Each GPIO -&gt; 330 ohm -&gt; anode; cathode -&gt; GND</text><path d="M455 388H575V654H665" fill="none" stroke="#b65f32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="665" y="740" width="865" height="120" rx="8" fill="white" stroke="#c4c9c3" /><text x="690" y="773" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#276f6e">BUZZER TEST CIRCUIT</text><text x="690" y="807" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">GPIO26 -&gt; 1 kohm -&gt; buzzer +</text><text x="690" y="840" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#677078">Buzzer - -&gt; GND; electrical type not identified</text><path d="M455 444H600V798H665" fill="none" stroke="#b65f32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="740" width="470" height="175" rx="8" fill="#ebe5d6" stroke="none" /><text x="90" y="774" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#b65f32">READ BEFORE REBUILDING</text><text x="90" y="811" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Do not feed 5 V into ESP32 inputs.</text><text x="90" y="849" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Keep the buzzer series resistor.</text><text x="90" y="887" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Axis orientation is learned in the UI.</text><path d="M52 971L1548 971" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><text x="52" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#677078">Firmware netlist is authoritative. Lead colours/hidden breadboard rows cannot be established from photos alone.</text></svg>