<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#ccd0ce"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs><rect x="0" y="0" width="1600" height="1040" rx="8" fill="#faf7ef" stroke="none" /><rect x="0" y="125" width="1600" height="865" rx="8" fill="url(#grid)" stroke="none" /><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#20232a">06 / A CALL IS A PHYSICAL STATE MACHINE</text><text x="52" y="98" font-family="Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#677078">The controls are sequential dependencies, not ornamental inputs.</text><path d="M52 118L1548 118" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><rect x="62" y="185" width="350" height="220" rx="8" fill="white" stroke="#c3c9c4" /><rect x="62" y="185" width="350" height="10" rx="0" fill="#276f6e" stroke="none" /><text x="82" y="240" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#276f6e">1 / TUNE</text><text x="82" y="296" font-family="Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#20232a">Find carrier with knob</text><text x="82" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#677078">Stable signal for 450 ms</text><path d="M414 289L441 289" fill="none" stroke="#20232a" stroke-width="3" stroke-linecap="round" /><rect x="447" y="185" width="350" height="220" rx="8" fill="white" stroke="#c3c9c4" /><rect x="447" y="185" width="350" height="10" rx="0" fill="#447aa3" stroke="none" /><text x="467" y="240" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#447aa3">2 / DIAL</text><text x="467" y="296" font-family="Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#20232a">Read extension on LCD</text><text x="467" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#677078">Keypad + # authorizes</text><path d="M799 289L826 289" fill="none" stroke="#20232a" stroke-width="3" stroke-linecap="round" /><rect x="832" y="185" width="350" height="220" rx="8" fill="white" stroke="#c3c9c4" /><rect x="832" y="185" width="350" height="10" rx="0" fill="#66517c" stroke="none" /><text x="852" y="240" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#66517c">3 / ROUTE</text><text x="852" y="296" font-family="Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#20232a">Interpret caller message</text><text x="852" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#677078">Joystick selects destination</text><path d="M1184 289L1211 289" fill="none" stroke="#20232a" stroke-width="3" stroke-linecap="round" /><rect x="1217" y="185" width="350" height="220" rx="8" fill="white" stroke="#c3c9c4" /><rect x="1217" y="185" width="350" height="10" rx="0" fill="#b65f32" stroke="none" /><text x="1237" y="240" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#b65f32">4 / CONNECT</text><text x="1237" y="296" font-family="Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#20232a">Hold main button safely</text><text x="1237" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#677078">1.35 s connection progress</text><text x="65" y="484" font-family="Arial,sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#20232a">EVERY 7-SECOND OPERATOR CYCLE</text><rect x="70.0" y="520" width="767.0714285714286" height="85" rx="0" fill="#467758" stroke="none" /><text x="454.5357142857143" y="569" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">SAFE / 3.7 s</text><rect x="839.0714285714286" y="520" width="226.64285714285705" height="85" rx="0" fill="#c79c39" stroke="none" /><text x="953.3928571428571" y="569" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">WARNING / 1.1 s</text><rect x="1067.7142857142858" y="520" width="372.1428571428571" height="85" rx="0" fill="#be4e45" stroke="none" /><text x="1254.7857142857142" y="569" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">WATCHING / 1.8 s</text><rect x="1441.857142857143" y="520" width="81.14285714285722" height="85" rx="0" fill="#467758" stroke="none" /><text x="70" y="651" font-family="Arial,sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#20232a">Release preserves partial progress. Retune if the carrier is lost.</text><rect x="70" y="699" width="1455" height="184" rx="8" fill="#eee3d7" stroke="none" /><text x="95" y="741" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#b65f32">EMERGENCY HANG UP</text><text x="95" y="786" font-family="Arial,sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#20232a">Reduces attention by 0.35; sacrifices code authorization and partial connection.</text><text x="95" y="830" font-family="Arial,sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#20232a">Three-second cooldown prevents repeated cancellation from erasing all risk.</text><path d="M52 971L1548 971" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><text x="52" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#677078">These are configured software timings, not measured end-to-end hardware latency. LEDs warn; LCD stays on call information.</text></svg>