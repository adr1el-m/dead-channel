roke-width="4" stroke-linecap="round" /><text x="992" y="665" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#467758">7</text><text x="992" y="711" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#447aa3">D8</text><path d="M1044 570L1044 632" fill="none" stroke="#467758" stroke-width="4" stroke-linecap="round" /><text x="1044" y="665" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#467758">8</text><text x="1044" y="711" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#447aa3">D9</text><text x="670" y="765" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#20232a">Physical connector contacts 1-8 -&gt; Nano D2-D9.</text><rect x="70" y="478" width="460" height="214" rx="8" fill="white" stroke="#c5cbc5" /><text x="92" y="517" font-family="Arial,sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#467758">BUTTON</text><text x="92" y="559" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">Nano D10 -&gt; switch -&gt; Nano GND</text><text x="92" y="602" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">No external pull-up required.</text><text x="92" y="644" font-family="Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#20232a">No 5V/GND wire on the keypad tail.</text><rect x="70" y="811" width="1460" height="117" rx="8" fill="#ebe5d6" stroke="none" /><text x="94" y="851" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#b65f32">Firmware interpretation for this specimen:</text><text x="94" y="893" font-family="Arial,sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#20232a">Rows = D9,D8,D7,D6; columns = D5,D4,D3,D2. Keep the physical D2-D9 wiring order above.</text><path d="M52 971L1548 971" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><text x="52" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#677078">A reversed tail initially decoded 1,2,3,4 as D,C,B,#. The scan map was corrected in firmware; do not reverse it again.</text></svg>