<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#ccd0ce"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs><rect x="0" y="0" width="1600" height="1040" rx="8" fill="#faf7ef" stroke="none" /><rect x="0" y="125" width="1600" height="865" rx="8" fill="url(#grid)" stroke="none" /><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#20232a">01 / THE SIGNAL PATH</text><text x="52" y="98" font-family="Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#677078">One browser game, one Linux host, three independent USB peripherals.</text><path d="M52 118L1548 118" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><rect x="545" y="152" width="510" height="160" rx="8" fill="white" stroke="#c5c9c5" /><rect x="545" y="152" width="510" height="11" rx="0" fill="#66517c" stroke="none" /><text x="565" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#66517c">iPad / browser</text><text x="565" y="240" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Authoritative game state + Canvas UI</text><text x="565" y="275" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Tuning / code / route / connection rules</text><path d="M800 313L800 377" fill="none" stroke="#66517c" stroke-width="5" stroke-linecap="round" /><text x="824" y="353" font-family="Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#66517c">Local Wi-Fi / HTTP + SSE</text><rect x="515" y="382" width="570" height="160" rx="8" fill="white" stroke="#c5c9c5" /><rect x="515" y="382" width="570" height="11" rx="0" fill="#b65f32" stroke="none" /><text x="535" y="430" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#b65f32">Raspberry Pi 5</text><text x="535" y="470" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">Serves files + Python USB bridge</text><text x="535" y="505" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">No cloud game server required</text><path d="M800 542L800 584" fill="none" stroke="#b65f32" stroke-width="5" stroke-linecap="round" /><path d="M265 584L1325 584" fill="none" stroke="#b65f32" stroke-width="5" stroke-linecap="round" /><path d="M265 584L265 627" fill="none" stroke="#b65f32" stroke-width="5" stroke-linecap="round" /><path d="M800 584L800 627" fill="none" stroke="#b65f32" stroke-width="5" stroke-linecap="round" /><path d="M1325 584L1325 627" fill="none" stroke="#b65f32" stroke-width="5" stroke-linecap="round" /><rect x="65" y="630" width="425" height="160" rx="8" fill="white" stroke="#c5c9c5" /><rect x="65" y="630" width="425" height="11" rx="0" fill="#276f6e" stroke="none" /><text x="85" y="678" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#276f6e">ESP32 / 3.3 V I/O</text><text x="85" y="718" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">IN  joystick, knob, connect button</text><text x="85" y="753" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">OUT  green/yellow/red + buzzer</text><rect x="570" y="630" width="460" height="160" rx="8" fill="white" stroke="#c5c9c5" /><rect x="570" y="630" width="460" height="11" rx="0" fill="#447aa3" stroke="none" /><text x="590" y="678" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#447aa3">Uno / 5 V I/O</text><text x="590" y="718" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">OUT  I2C 16x2 LCD</text><text x="590" y="753" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">OUT  5161AS callers remaining</text><rect x="1110" y="630" width="425" height="160" rx="8" fill="white" stroke="#c5c9c5" /><rect x="1110" y="630" width="425" height="11" rx="0" fill="#467758" stroke="none" /><text x="1130" y="678" font-family="Arial,sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#467758">Nano / 5 V I/O</text><text x="1130" y="718" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">IN  4x4 extension keypad</text><text x="1130" y="753" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#20232a">IN  emergency HANG UP</text><text x="80" y="902" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#20232a">USB carries power + serial data. No direct Uno-to-ESP32 signal wire is required.</text><text x="80" y="945" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#677078">Power: appropriate Pi USB-C supply -&gt; Pi USB ports -&gt; boards. iPad uses its own battery.</text><path d="M52 971L1548 971" fill="none" stroke="#c4c8c2" stroke-width="1" stroke-linecap="round" /><text x="52" y="1006" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#677078">Bidirectional outputs: browser POST -&gt; Pi serial -&gt; board. Inputs: board JSON -&gt; Pi SSE -&gt; browser.</text></svg>